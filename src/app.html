<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<!-- The number font is self-hosted (src/app.css); an optional interface font loads when chosen. -->
		<link rel="preload" href="/fonts/dm-mono/dm-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="/fonts/dm-mono/dm-mono-500-latin.woff2" as="font" type="font/woff2" crossorigin>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			(function () {
				var VIEW_KEY = 'darko-view';
				var params = new URLSearchParams(window.location.search);
				var displayPreview = params.get('display');
				var legacyPreview = params.get('view');
				var requestedView = displayPreview === 'shiny' || displayPreview === 'modern'
					? displayPreview
					: legacyPreview;
				var view = requestedView === 'shiny' || requestedView === 'modern'
					? requestedView
					: 'modern';
				if (requestedView !== 'shiny' && requestedView !== 'modern') {
					try {
						view = localStorage.getItem(VIEW_KEY) === 'shiny' ? 'shiny' : 'modern';
					} catch (e) {
						view = 'modern';
					}
				}
				document.documentElement.dataset.view = view;
				const THEME_KEY = 'darko-theme';
				var THEMES = ['black', 'dark', 'light', 'white'];
				try {
					var saved = localStorage.getItem(THEME_KEY);
					var theme = THEMES.indexOf(saved) !== -1 ? saved : 'white';
					document.documentElement.dataset.theme = theme;
				} catch (e) {
					document.documentElement.dataset.theme = 'white';
				}
				// Mirror of isTimeMachineFolded (src/lib/utils/timeMachine.js): the reader's own choice
				// wins; without one the strip starts folded unless a date is set or the page is Rewind.
				var tmChoice = null;
				try {
					tmChoice = localStorage.getItem('darko-time-machine');
				} catch (e) {}
				var tmDated = /^\d{4}-\d{2}-\d{2}$/.test(params.get('asof') || '');
				var tmFolded = tmChoice === 'collapsed'
					|| (tmChoice !== 'open' && !tmDated && window.location.pathname !== '/rewind');
				if (tmFolded) {
					document.documentElement.dataset.timeMachine = 'collapsed';
				}
				try {
					var FONT_KEY = 'darko-font';
						var FONTS = ['inter', 'roboto', 'lato', 'opensans', 'sourcesans', 'nunito', 'worksans', 'raleway', 'outfit', 'jakarta', 'spacegrotesk', 'system'];
						var savedFont = localStorage.getItem(FONT_KEY);
						if (savedFont === 'dm') {
							savedFont = 'system';
							localStorage.setItem(FONT_KEY, savedFont);
						}
						var font = FONTS.indexOf(savedFont) !== -1 ? savedFont : 'system';
						document.documentElement.dataset.font = font;
						localStorage.setItem(FONT_KEY, font);
						// Mirror of OPTIONAL_FONT_FAMILIES in src/lib/fonts.js.
						var FONT_FAMILIES = {
							inter: 'Inter:wght@400;500;600;700',
							roboto: 'Roboto:wght@400;500;700',
							lato: 'Lato:wght@400;700',
							opensans: 'Open+Sans:wght@400;500;600;700',
							sourcesans: 'Source+Sans+3:wght@400;500;600;700',
							nunito: 'Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700',
							worksans: 'Work+Sans:wght@400;500;600;700',
							raleway: 'Raleway:wght@400;500;600;700',
							outfit: 'Outfit:wght@400;500;600;700',
							jakarta: 'Plus+Jakarta+Sans:wght@400;500;600;700',
							spacegrotesk: 'Space+Grotesk:wght@400;500;600;700'
						};
						if (FONT_FAMILIES[font]) {
							var fontLink = document.createElement('link');
							fontLink.rel = 'stylesheet';
							fontLink.href = 'https://fonts.googleapis.com/css2?family=' + FONT_FAMILIES[font] + '&display=swap';
							fontLink.setAttribute('data-font-family', font);
							document.head.appendChild(fontLink);
						}
					} catch (e) {
						document.documentElement.dataset.font = 'system';
					}
				})();
			</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
